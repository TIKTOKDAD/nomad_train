# ============================================================
# 数据配置文件
# ============================================================
# 本文件定义了ViNT项目中所有数据集的配置参数
# 
# 主要内容：
# 1. 全局参数 - 扩散模型的动作统计信息
# 2. 数据集特定参数 - 每个数据集的路径点间距和相机参数
#
# 使用场景：
# - 训练时归一化动作数据
# - 推理时反归一化动作输出
# - 可视化时进行相机投影
# - 不同数据集的特定配置
#
# 关键概念：
# - metric_waypoint_spacing: 路径点之间的平均物理距离（米）
# - action_stats: 用于将动作归一化到[-1, 1]范围
# - camera_metrics: 相机内参和畸变系数（用于可视化）

# ========== 全局参数：扩散模型动作统计 ==========
# 这些统计信息用于NoMaD扩散模型的动作归一化

action_stats:
  # 动作的最小值 [min_dx, min_dy]
  # dx: x方向的位移增量（米），正值表示前进
  # dy: y方向的位移增量（米），正值表示左移
  min: [-2.5, -4]
  
  # 动作的最大值 [max_dx, max_dy]
  max: [5, 4]
  
  # 说明：
  # - 这些值是从所有训练数据中统计得出的
  # - 用于将动作归一化到[-1, 1]范围：
  #   normalized = (action - min) / (max - min) * 2 - 1
  # - 归一化有助于扩散模型的训练稳定性
  # - 推理时需要反归一化：
  #   action = (normalized + 1) / 2 * (max - min) + min

# ========== 数据集特定参数 ==========
# 每个数据集都有自己的配置，主要是路径点间距和可选的相机参数

# ---------- recon 数据集 ----------
recon:
  # 路径点之间的平均物理间距（米）
  # 用途：
  # - 将归一化的预测转换为真实物理距离
  # - 控制导航的精细程度
  # - 影响子目标的选择距离
  metric_waypoint_spacing: 0.25
  
  # 相机参数（可选，仅用于可视化）
  # 参考：https://docs.opencv.org/4.x/dc/dbb/tutorial_py_calibration.html
  camera_metrics:
    # 相机离地面的高度（米）
    camera_height: 0.95
    
    # 相机相对于机器人中心的x轴偏移（米）
    # 正值表示相机在机器人前方
    camera_x_offset: 0.45
    
    # 相机内参矩阵参数
    # 用于将3D点投影到2D图像平面
    camera_matrix:
      fx: 272.547000  # x方向焦距（像素）
      fy: 266.358000  # y方向焦距（像素）
      cx: 320.000000  # 主点x坐标（像素）
      cy: 220.000000  # 主点y坐标（像素）
    
    # 畸变系数
    # 用于校正镜头畸变
    dist_coeffs:
      k1: -0.038483  # 径向畸变系数1
      k2: -0.010456  # 径向畸变系数2
      p1: 0.003930   # 切向畸变系数1
      p2: -0.001007  # 切向畸变系数2
      k3: 0.0        # 径向畸变系数3

