# ---------- botanic 数据集 ----------
# metric_waypoint_spacing 为该数据集中相邻原始 waypoint 的平均米制距离。
# Dataset.normalize=True 时，动作坐标会除以该值（再乘 waypoint_spacing）。
botanic:
  metric_waypoint_spacing: 0.3535821735858917

# ---------- cid_sims 数据集 ----------
# 仿真/采集数据的物理步长，用于把归一化动作还原成真实尺度。
