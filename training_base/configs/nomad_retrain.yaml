      goals_per_obs: 2
      # 是否启用负样本挖掘
      negative_mining: true
    # openloris 数据集
    openloris:
      # 数据集根目录
      data_folder: ../datasets/openloris
      # 训练集分割路径
      train: ../data_splits/openloris/train/
      # 测试集分割路径
      test: ../data_splits/openloris/test/
      # 序列末端 slack
      end_slack: 2
      # 每个观测采样的目标数量
      goals_per_obs: 2
      # 是否启用负样本挖掘
      negative_mining: true
    # musohu 数据集
    musohu:
      # 数据集根目录
      data_folder: ../datasets/musohu
      # 训练集分割路径
      train: ../data_splits/musohu/train/
      # 测试集分割路径
      test: ../data_splits/musohu/test/
      # 序列末端 slack
      end_slack: 2
      # 每个观测采样的目标数量
      goals_per_obs: 1
      # 是否启用负样本挖掘
      negative_mining: true
    # ground_challenge 数据集
    ground_challenge:
      # 数据集根目录
      data_folder: ../datasets/ground_challenge
      # 训练集分割路径
      train: ../data_splits/ground_challenge/train/
      # 测试集分割路径
      test: ../data_splits/ground_challenge/test/
      # 序列末端 slack
      end_slack: 2
