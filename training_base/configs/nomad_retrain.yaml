model:
  # 模型注册名：对应 build_nomad
  name: nomad
  # 视觉编码器配置：输出 diffusion 和 distance_predictor 共享的条件向量
  vision_encoder:
    # 编码器类型：masked_vint 支持 goal_mask
    name: masked_vint
    # 观测编码器骨干
    obs_encoder: efficientnet-b0
    # 编码维度：需与 distance_predictor.embedding_dim 对齐
    encoding_size: 256
    # Transformer 配置
    transformer:
      # 注意力头数
      num_heads: 4
      # 层数
      num_layers: 4
      # 前馈层维度因子
      ff_dim_factor: 4
  # 扩散模型主干：ConditionalUnet1D 预测动作加噪后的 epsilon
  diffusion:
    # UNet 类型
    name: conditional_unet1d
    # 输入维度（动作维度）
    input_dim: 2
    # 下采样通道数：控制 U-Net 多尺度通道宽度
    down_dims: [64, 128, 256]
    # 是否预测条件缩放
    cond_predict_scale: false
  # 扩散调度器：训练加噪和可视化采样共用
  diffusion_scheduler:
    # 调度器名称
    name: ddpm
    # 训练时间步数
    num_train_timesteps: 10
    # beta 计划
    beta_schedule: squaredcos_cap_v2
    # 是否裁剪采样
    clip_sample: true
    # 预测类型（epsilon/v_prediction）
    prediction_type: epsilon
  # 距离预测分支
  distance_predictor:
    # 预测器名称
    name: distance_mlp
    # 特征维度
    embedding_dim: 256

objective:
  # 目标函数注册名：NoMaD distance + denoising objective
  name: nomad_diffusion
  # 目标图像遮蔽概率：训练时随机屏蔽目标图，学习无目标条件行为
  goal_mask_prob: 0.5
  # 距离损失权重：扩散损失权重为 1-alpha
  alpha: 1e-4
  # 距离掩码策略
  distance_mask_mode: per_sample
  # 子损失配置
  losses:
    # 扩散损失
    diffusion: mse
    # 距离损失
    distance: mse

optimizer:
  # 优化器名称
  name: adamw
  # 学习率
  lr: 1e-4
  # 梯度裁剪配置
  gradient_clip:
    # 是否启用裁剪
    enabled: false
    # 最大范数
    max_norm: 1.0

scheduler:
  # 调度器名称
  name: cosine
  # 总 epoch 数
  epochs: 100
  # 初始学习率
  lr: 1e-4
  # warmup 配置
  warmup:
    # 是否启用 warmup
    enabled: true
    # warmup epoch 数
    epochs: 2
  # CyclicLR 周期长度
  cyclic_period: 10
  # ReduceLROnPlateau 容忍 epoch 数
  plateau_patience: 3
  # ReduceLROnPlateau 衰减系数
  plateau_factor: 0.5

metrics:
  # 重指标列表
  heavy:
    - name: nomad_behavior

logging:
  # 指标日志频率（步）
  metric_log_freq: 100
  # 图像日志频率（步）
  image_log_freq: 3000
  # 重指标日志频率（步）
  heavy_metric_log_freq: 1000
  # 重指标开始步数
  heavy_metric_start_step: 1000
  # 图像日志开始步数
  image_start_step: 3000
  # 性能日志频率（步）
  perf_log_freq: 50
  # 是否按 global_step 统计频率
  by_global_step: true
  # 是否在第 0 步也记录
  first_step: false
  # 移动平均窗口大小
  window_size: 100
  # 日志 sink 列表
  sinks:
    # 控制台输出
    - name: console
    # Weights & Biases
    - name: wandb
      # 是否启用 wandb
      enabled: true
      # wandb 实体/组织
      entity: 1948627929-university-of-central-florida

visualization:
  # 每次可视化记录的图片数量
  num_images_log: 8
  # 动作采样数量
  num_action_samples_log: 8
  # 训练阶段可视化器
  train:
    - name: nomad_action_distribution
  # 评估阶段可视化器
  eval:
    - name: nomad_action_distribution

callbacks:
  # 检查点保存回调
  - name: checkpoint
    # 每个 epoch 保存 latest
    save_latest_every_epoch: true
    # 周期性保存历史 checkpoint
    checkpoint_freq: 5
  # 性能监控回调
  - name: perf_monitor
