algorithm:
  name: nomad
  ema:
    enabled: true
    power: 0.75

runtime:
  project_name: nomad
  run_name: nomad

data:
  context_size: 3
  image_size: [96, 96]
  len_traj_pred: 8
  learn_angle: false
  action:
    min_dist_cat: 3
    max_dist_cat: 20

model:
  name: nomad
  vision_encoder:
    name: masked_vint
    obs_encoder: efficientnet-b0
    encoding_size: 256
    transformer:
      num_heads: 4
      num_layers: 4
      ff_dim_factor: 4
  diffusion:
    name: conditional_unet1d
    input_dim: 2
    down_dims: [64, 128, 256]
    cond_predict_scale: false
  diffusion_scheduler:
    name: ddpm
    num_train_timesteps: 10
  distance_predictor:
    name: distance_mlp
    embedding_dim: 256

objective:
  name: nomad_diffusion
  goal_mask_prob: 0.5
  alpha: 1e-4
  losses:
    diffusion: mse
    distance: mse

optimizer:
  name: adamw
  lr: 1e-4

scheduler:
  name: cosine
  epochs: 100
  lr: 1e-4
  warmup:
    enabled: true
    epochs: 2

metrics:
  heavy:
    - name: nomad_behavior

visualization:
  train:
    - name: nomad_action_distribution
  eval:
    - name: nomad_action_distribution

callbacks:
  - name: checkpoint
    save_latest_every_epoch: true
    checkpoint_freq: 5
  - name: perf_monitor
