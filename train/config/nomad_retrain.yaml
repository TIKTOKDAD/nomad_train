# ============================================================
# NoMaD (Goal Masking Diffusion Policies) 配置文件
# ============================================================
# NoMaD是基于扩散策略的导航和探索模型
# 核心创新：
# 1. 使用扩散模型生成轨迹（而非直接回归）
# 2. 目标掩码机制（Goal Masking）支持无目标探索
# 3. 更长的轨迹预测（8个航点 vs ViNT的5个）

# ========== 项目基本信息 ==========
project_name: nomade_5_60  # 项目名称：NoMaD
run_name: nomad      # 运行名称

# ========== 训练基本设置 ==========
use_wandb: True     # 使用Weights & Biases进行实验跟踪
train: True         # 训练模式
batch_size: 64     # 批次大小（与ViNT相同）
epochs: 60         # 训练轮次（需要更长时间训练扩散模型）
gpu_ids: [1]        # 使用的GPU ID
num_workers: 32     # 数据加载工作进程数
lr: 1e-5            # 学习率 0.0001（比ViNT的5e-4更小）
                    # 扩散模型通常需要更小的学习率以稳定训练
load_run: nomad
optimizer: adamw    # AdamW优化器（带权重衰减）
clipping: False     # 不使用梯度裁剪
max_norm: 1.        # 梯度裁剪的最大范数（未启用）
scheduler: "cosine" # 余弦退火学习率调度器
warmup: True        # 启用学习率预热（扩散模型训练的常见做法）
warmup_epochs: 2    # 预热轮次
cyclic_period: 10   # 循环学习率周期（未使用）
plateau_patience: 3 # 平台调度器的耐心值（未使用）
plateau_factor: 0.5 # 平台调度器的衰减因子（未使用）
seed: 0             # 随机种子

# ========== NoMaD模型架构参数 ==========
model_type: nomad   # 模型类型：NoMaD（扩散策略模型）

# 视觉编码器配置
vision_encoder: nomad_vint  # 视觉编码器类型
                            # nomad_vint: 基于ViNT的编码器（使用GroupNorm替代BatchNorm）
                            # vib: Vision-based Imitation Behavior编码器
                            # vit: Vision Transformer编码器
encoding_size: 256          # 编码维度（比ViNT的512小，更轻量）
obs_encoder: efficientnet-b0  # 观测编码器：EfficientNet-B0

# Transformer注意力机制参数
attn_unet: False            # 是否在UNet中使用注意力机制
cond_predict_scale: False   # 是否预测条件缩放因子
mha_num_attention_heads: 4  # 多头注意力的头数
mha_num_attention_layers: 4 # 注意力层数
mha_ff_dim_factor: 4        # 前馈网络维度因子

# UNet下采样维度配置
down_dims: [64, 128, 256]   # UNet的下采样通道数
                            # 定义噪声预测网络的架构
                            # [64, 128, 256] 表示三层下采样

# ========== 扩散模型参数 ==========
num_diffusion_iters: 10     # 扩散迭代次数（去噪步数）
                            # 训练时添加噪声的步数
                            # 推理时从噪声恢复轨迹的步数
                            # 10是较少的步数，平衡质量和速度

# ========== 目标掩码机制 ==========
goal_mask_prob: 0.5         # 【核心创新】目标掩码概率
                            # 训练时有50%的概率掩盖目标图像
                            # 这使模型学会：
                            # - 有目标时：目标导向导航
                            # - 无目标时：自主探索
                            # 实现单一模型支持导航和探索两种模式

# ========== 动作空间归一化 ==========
normalize: True     # 归一化动作空间

# ========== 上下文配置 ==========
context_type: temporal  # 时序上下文
context_size: 3         # 上下文大小为3（比ViNT的5小）
                        # 注释中的5是另一个可选值
                        # 较小的上下文减少计算量

# ========== 损失函数权重 ==========
alpha: 1e-4             # 距离损失和扩散损失的权衡系数
                        # 0.0001 - 非常小的值
                        # 表示主要关注扩散损失（轨迹生成质量）
                        # 距离预测是辅助任务

# ========== 距离分类边界 ==========
# 用于定义目标采样和动作预测的距离范围（单位：航点数，非米）
# 实际物理距离 = 航点数 × waypoint_spacing × metric_waypoint_spacing
distance:
  min_dist_cat: 0   # 目标采样的最小距离（航点数），构建距离类别的下界
  max_dist_cat: 20  # 目标采样的最大距离（航点数），构建距离类别的上界
action:
  min_dist_cat: 3   # 动作预测生效的最小距离阈值（航点数）- 距离 > 此值才计算动作损失
                    # 比ViNT的2更大，过滤掉更多近距离样本
  max_dist_cat: 20  # 动作预测生效的最大距离阈值（航点数）- 距离 < 此值才计算动作损失
                    # 比ViNT的10更大，支持更远距离的动作预测

# ========== 动作输出参数 ==========
len_traj_pred: 8    # 【关键】预测轨迹长度为8个航点
                    # 比GNM/ViNT的5个更长
                    # 扩散模型可以生成更长的轨迹序列
learn_angle: False  # 【关键】不学习航向角
                    # 仅预测(x, y)位置，不预测yaw
                    # 简化扩散模型的输出空间

# ========== 数据集特定参数 ==========
image_size: [96, 96]  # 【关键】图像尺寸为96x96（正方形）
                      # 比ViNT的[85, 64]更大且为正方形
                      # 更高分辨率可能提升扩散模型性能

